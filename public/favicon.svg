<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo sólido oscuro para que se vea bien en temas claros y oscuros -->
  <path d="M64 10 L115 40 L115 88 L64 118 L13 88 L13 40 Z" fill="#1A1A2E" />
  
  <!-- Hexágono con borde más grueso para visibilidad en miniatura -->
  <path d="M64 10 L115 40 L115 88 L64 118 L13 88 L13 40 Z" stroke="#6C5CE7" stroke-width="12" stroke-linejoin="round" />
  
  <!-- Onda central simplificada y mucho más gruesa -->
  <path d="M35 64 Q49.5 40 64 64 Q78.5 88 93 64" stroke="#00CEC9" stroke-width="14" stroke-linecap="round" fill="none" />
  
  <!-- Punto central resaltado -->
  <circle cx="64" cy="64" r="8" fill="#F7F7FC" />
</svg>
